function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((msg, type = 'success') => {
    const id = uid();
    setToasts(t => [...t, { id, msg, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);
  return (
    <AppContext.Provider value={{ push }}>
      {children}
      <div className="fixed bottom-4 right-4 z-[100] space-y-2 max-w-xs">
        {toasts.map(t => (
          <div key={t.id} className={`fade-in px-4 py-3 rounded-xl border shadow-lg glass text-sm flex items-center gap-2 ${
            t.type === 'error' ? 'border-danger/40 text-danger' :
            t.type === 'warning' ? 'border-warning/40 text-warning' :
            'border-success/40 text-success'
          }`}>
            {t.type === 'error' ? <XCircle size={16} /> : t.type === 'warning' ? <AlertTriangle size={16} /> : <CheckCircle size={16} />}
            {t.msg}
          </div>
        ))}
      </div>
    </AppContext.Provider>
  );
}

function Login({ onLogin }) {
  const [email, setEmail] = useState('admin@vit.io');
  const [password, setPassword] = useState('demo1234');

  const [success, setSuccess] = useState('');

  const submit = (e) => {
    e?.preventDefault();
    setError(''); setSuccess('');
    if (!email.includes('@')) { setError('Please enter a valid email'); return; }
    if (password.length < 4) { setError('Password must be at least 4 characters'); return; }
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      if (password === 'wrong') { setError('Invalid credentials'); return; }
      setSuccess('Login successful! Redirecting...');
      setTimeout(() => onLogin({ email, remember }), 700);
    }, 900);
  };

  const demo = () => {
    setEmail('admin@vit.io'); setPassword('demo1234');
    setTimeout(() => submit(), 100);
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
      <div className="absolute inset-0 -z-10">
        <div className="absolute top-1/4 left-1/4 w-96 h-96 bg-primary/10 rounded-full blur-3xl" />

            <Shield size={28} className="text-white" />
          </div>

          <p className="text-sm text-muted mt-1">Device Management Platform</p>
        </div>
        <Card className="p-6">
          <form onSubmit={submit}>
            <Field label="Email">
              <Input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@company.com" />
            </Field>
            <Field label="Password">
              <div className="relative">
                <Input type={show ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
                <button type="button" onClick={() => setShow(!show)} className="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 text-muted hover:text-txt">
                  {show ? <EyeOff size={16} /> : <Eye size={16} />}
                </button>
              </div>
            </Field>

function Devices({ setPage, devices, setDevices, setSelectedDevice }) {
  const { push } = useApp();
  const [view, setView] = useState('table');
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [mfrFilter, setMfrFilter] = useState('all');
  const [sortBy, setSortBy] = useState('name');
  const [sortDir, setSortDir] = useState('asc');
  const [page, setPage] = useState(1);
  const [loading, setLoading] = useState(false);
  const [modalDevice, setModalDevice] = useState(null);

  const filtered = useMemo(() => {
    let out = devices.filter(d => {
      const s = search.toLowerCase();
      const okSearch = !s || d.name.toLowerCase().includes(s) || d.id.toLowerCase().includes(s) || d.model.toLowerCase().includes(s);
      const okStatus = statusFilter === 'all' || d.status === statusFilter;
      const okMfr = mfrFilter === 'all' || d.manufacturer === mfrFilter;
      return okSearch && okStatus && okMfr;
    });
    out.sort((a, b) => {
      const av = a[sortBy], bv = b[sortBy];
      if (typeof av === 'number') return sortDir === 'asc' ? av - bv : bv - av;
      return sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
    });
    return out;
  }, [devices, search, statusFilter, mfrFilter, sortBy, sortDir]);

  useEffect(() => { setPage(1); }, [search, statusFilter, mfrFilter]);

  const pageData = filtered.slice((page - 1) * 10, page * 10);

  const refresh = () => {
    setLoading(true);
    setTimeout(() => { setDevices(genDevices(28)); setLoading(false); push('Devices refreshed with new demo data'); }, 700);
  };

  const exportCSV = () => {
    const csv = 'Name,ID,Model,Android,Manufacturer,Battery,Status,Last Seen,Added\n' +
      filtered.map(d => `${d.name},${d.id},${d.model},${d.androidVersion},${d.manufacturer},${d.battery}%,${d.status},${d.lastSeen},${d.addedDate}`).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'devices.csv'; a.click();
    URL.revokeObjectURL(url);
    push('Devices exported to CSV');
  };

  const openDetails = (d) => {
    setSelectedDevice(d);
    setPage('device-detail');
  };

  const SortHead = ({ k, children }) => (
    <th className="text-left px-3 py-2.5 text-xs font-semibold text-muted uppercase tracking-wider cursor-pointer hover:text-txt whitespace-nowrap" onClick={() => {
      if (sortBy === k) setSortDir(sortDir === 'asc' ? 'desc' : 'asc');
      else { setSortBy(k); setSortDir('asc'); }
    }}>
      <span className="inline-flex items-center gap-1">{children} {sortBy === k && (sortDir === 'asc' ? '↑' : '↓')}</span>
    </th>
  );

  const StatusBadge = ({ s }) => (
    <Badge type={s === 'online' ? 'success' : s === 'offline' ? 'danger' : 'warning'}>
      <span className={`w-1.5 h-1.5 rounded-full ${s === 'online' ? 'bg-success' : s === 'offline' ? 'bg-danger' : 'bg-warning'} ${s === 'online' ? 'pulse-dot' : ''}`} />
      {s}
    </Badge>
  );

  return (
    <div className="space-y-4 fade-in">
      <div className="flex flex-wrap items-center justify-between gap-2">
        <div>
          <h1 className="text-xl md:text-2xl font-bold text-txt">Devices</h1>
          <p className="text-sm text-muted mt-1">{devices.length} devices in inventory (demo data)</p>
        </div>
        <div className="flex gap-2">
          <Button variant="secondary" size="sm" onClick={refresh} icon={RefreshCw}>Refresh</Button>
          <Button variant="secondary" size="sm" onClick={exportCSV} icon={Download}>Export CSV</Button>
          <div className="flex rounded-lg border border-white/10 overflow-hidden">
            <button onClick={() => setView('table')} className={`px-2.5 py-1.5 ${view === 'table' ? 'bg-primary text-white' : 'text-muted hover:bg-white/5'}`}><List size={14} /></button>
            <button onClick={() => setView('grid')} className={`px-2.5 py-1.5 ${view === 'grid' ? 'bg-primary text-white' : 'text-muted hover:bg-white/5'}`}><Grid size={14} /></button>
          </div>
        </div>
      </div>

      <Card className="p-3">
        <div className="flex flex-wrap gap-2">
          <div className="relative flex-1 min-w-[200px]">
            <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-muted" />
            <Input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search devices..." className="pl-9" />
          </div>
          <Select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="w-36">
            <option value="all">All Status</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
            <option value="pending">Pending</option>
          </Select>
          <Select value={mfrFilter} onChange={e => setMfrFilter(e.target.value)} className="w-40">
            <option value="all">All Manufacturers</option>
            {manufacturers.map(m => <option key={m} value={m}>{m}</option>)}
          </Select>
        </div>
      </Card>

      {loading ? <Card className="p-5"><Skeleton /></Card> : view === 'table' ? (
        <Card className="overflow-hidden">
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className="bg-white/5 border-b border-white/5">
                <tr>
                  <SortHead k="name">Device</SortHead>
                  <SortHead k="id">ID</SortHead>

                  <SortHead k="status">Status</SortHead>
                  <SortHead k="lastSeen">Last Seen</SortHead>
                  <th className="px-3 py-2.5"></th>
                </tr>
              </thead>
              <tbody className="divide-y divide-white/5">
                {pageData.map(d => (
                  <tr key={d.id} className="hover:bg-white/5 transition-colors">
                    <td className="px-3 py-2.5 font-medium text-txt whitespace-nowrap">{d.name}</td>
                    <td className="px-3 py-2.5 text-muted text-xs font-mono">{d.id}</td>

                    <td className="px-3 py-2.5">
                      <div className="flex items-center gap-2">
                        <Battery size={12} className="text-muted" />

                      </div>
                    </td>
                    <td className="px-3 py-2.5"><StatusBadge s={d.status} /></td>
                    <td className="px-3 py-2.5 text-muted text-xs whitespace-nowrap">{d.lastSeen}</td>
                    <td className="px-3 py-2.5">
                      <button onClick={() => openDetails(d)} className="text-xs text-primary hover:underline">View</button>

                ))}
              </tbody>
            </table>
          </div>
          {!pageData.length && <EmptyState title="No devices found" desc="Try adjusting your filters" icon={Smartphone} />}
          <div className="px-4 py-3 border-t border-white/5">
            <Pagination page={page} total={filtered.length} onChange={setPage} />

      ) : (
        <>

                  <StatusBadge s={d.status} />

                <div className="text-xs text-muted font-mono">{d.id}</div>

  const cats = ['all', 'system', 'devices', 'security', 'updates'];
  const filtered = notifications.filter(n => cat === 'all' || n.category === cat);

  const markAllRead = () => { setNotifications(ns => ns.map(n => ({ ...n, read: true }))); push('All notifications marked as read'); };
  const toggleRead = (id) => setNotifications(ns => ns.map(n => n.id === id ? { ...n, read: !n.read } : n));
  const del = (id) => { setNotifications(ns => ns.filter(n => n.id !== id)); push('Notification deleted'); };

  const catColor = { system: 'primary', devices: 'success', security: 'danger', updates: 'warning' };
  const catIcon = { system: SettingsIcon, devices: Smartphone, security: Shield, updates: Download };

  return (
    <div className="space-y-4 fade-in">
      <div className="flex flex-wrap items-center justify-between gap-2">

        <Button variant="secondary" size="sm" onClick={markAllRead} icon={Check}>Mark all as read</Button>
      </div>
      <div className="flex flex-wrap gap-1">
        {cats.map(c => (
          <button key={c} onClick={() => setCat(c)} className={`px-3 py-1.5 text-sm rounded-lg capitalize ${cat === c ? 'bg-primary text-white' : 'bg-white/5 text-muted hover:bg-white/10'}`}>{c}</button>
        ))}
      </div>
      <div className="space-y-2">
        {filtered.map(n => {
          const Icon = catIcon[n.category] || Bell;
          return (
            <Card key={n.id} className={`p-4 ${!n.read ? 'border-primary/20' : ''}`}>
              <div className="flex items-start gap-3">
                <div className={`w-9 h-9 rounded-lg flex items-center justify-center shrink-0 bg-${catColor[n.category]}/15 text-${catColor[n.category]}`}>
                  <Icon size={16} />
                </div>
                <div className="flex-1 min-w-0 cursor-pointer" onClick={() => { setModal(n); if (!n.read) toggleRead(n.id); }}>
                  <div className="flex items-center gap-2">
                    <span className="font-medium text-txt text-sm">{n.title}</span>
                    {!n.read && <span className="w-2 h-2 rounded-full bg-primary" />}
                  </div>
                  <div className="text-sm text-muted mt-0.5">{n.message}</div>
                  <div className="text-xs text-muted/70 mt-1.5">{fmtDateTime(n.timestamp)} · <span className="capitalize">{n.category}</span></div>
                </div>
                <div className="flex gap-1">
                  <button onClick={() => toggleRead(n.id)} className="p-1.5 text-muted hover:text-primary rounded hover:bg-white/5" title="Toggle read"><CheckCircle size={14} /></button>
                  <button onClick={() => del(n.id)} className="p-1.5 text-muted hover:text-danger rounded hover:bg-white/5" title="Delete"><Trash2 size={14} /></button>
                </div>
              </div>
            </Card>
          );
        })}
      </div>
      {!filtered.length && <EmptyState title="No notifications" desc="You're all caught up" icon={Bell} />}
      <Modal open={!!modal} onClose={() => setModal(null)} title="Notification">
        {modal && <div>
          <div className="flex items-center gap-2 mb-2"><Badge type={catColor[modal.category]}>{modal.category}</Badge>{modal.read ? <Badge type="muted">Read</Badge> : <Badge type="primary">Unread</Badge>}</div>
          <h4 className="font-semibold text-txt text-lg">{modal.title}</h4>
          <p className="text-sm text-muted mt-2">{modal.message}</p>
          <p className="text-xs text-muted/60 mt-3">{fmtDateTime(modal.timestamp)}</p>
        </div>}
      </Modal>
    </div>
  );
}

function UsersPage() {
  const { push } = useApp();
  const [users, setUsers] = useState(genUsers);
  const [search, setSearch] = useState('');
  const [roleFilter, setRoleFilter] = useState('all');
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: '', email: '', role: 'Viewer' });

  const filtered = users.filter(u => {
    const s = search.toLowerCase();
    return (!s || u.name.toLowerCase().includes(s) || u.email.toLowerCase().includes(s)) && (roleFilter === 'all' || u.role === roleFilter);
  });

  const save = () => {
    if (!form.name || !form.email) { push('Please fill all fields', 'error'); return; }
    if (editing) {
      setUsers(us => us.map(u => u.id === editing.id ? { ...u, ...form } : u));
      push('User updated');
    } else {
      setUsers(us => [...us, { id: `USR-${uid()}`, ...form, status: 'active', lastLogin: new Date().toISOString(), avatar: form.name.split(' ').map(n => n[0]).join('').slice(0, 2) }]);
      push('User created');
    }
    setModalOpen(false); setEditing(null); setForm({ name: '', email: '', role: 'Viewer' });
  };

  const del = (u) => {
    if (!confirm(`Delete ${u.name}? (demo)`)) return;
    setUsers(us => us.filter(x => x.id !== u.id)); push('User deleted');
  };

  const roleColor = { 'Super Admin': 'danger', 'Administrator': 'primary', 'Manager': 'warning', 'Viewer': 'muted' };

  return (
    <div className="space-y-4 fade-in">
      <div className="flex flex-wrap items-center justify-between gap-2">

        <Button size="sm" onClick={() => { setEditing(null); setForm({ name: '', email: '', role: 'Viewer' }); setModalOpen(true); }} icon={Plus}>Create User</Button>

            <Input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search users..." className="pl-9" />
          </div>
          <Select value={roleFilter} onChange={e => setRoleFilter(e.target.value)} className="w-40">
            <option value="all">All Roles</option>
            {['Super Admin', 'Administrator', 'Manager', 'Viewer'].map(r => <option key={r} value={r}>{r}</option>)}
          </Select>
        </div>
      </Card>
      <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
        {filtered.map(u => (
          <Card key={u.id} className="p-4">

  switch (page) {
    case 'overview': return <Overview setPage={setPage} />;
    case 'devices': return <Devices setPage={setPage} devices={devices} setDevices={setDevices} setSelectedDevice={setSelectedDevice} />;
    case 'device-detail': return <DeviceDetail device={selectedDevice} setPage={setPage} />;
    case 'analytics': return <Analytics />;
    case 'inventory': return <Inventory />;
    case 'logs': return <ActivityLogs />;
    case 'notifications': return <Notifications notifications={notifications} setNotifications={setNotifications} />;
    case 'reports': return <Reports />;
    case 'users': return <UsersPage />;
    case 'server': return <ServerStatus />;
    case 'api': return <ApiDocs />;
    case 'settings': return <SettingsPage onResetData={resetData} />;
    case 'help': return <HelpSupport />;
    default: return <Overview setPage={setPage} />;
  }
}

/* ============ APP ROOT ============ */
function App() {
  const [user, setUser] = useState(() => {
    const saved = localStorage.getItem('vit_user');
    return saved ? JSON.parse(saved) : null;
  });
  const [page, setPage] = useState('overview');
  const [notifications, setNotifications] = useState(genNotifications);

  const login = (u) => {
    setUser(u);
    if (u.remember) localStorage.setItem('vit_user', JSON.stringify(u));
  };
  const logout = () => {
    setUser(null);
    localStorage.removeItem('vit_user');
    setPage('overview');
  };

  return (
    <ToastProvider>
      {!user ? (
        <Login onLogin={login} />
      ) : (
        <Layout user={user} page={page} setPage={setPage} onLogout={logout} notifications={notifications} setNotifications={setNotifications} />
      )}
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
